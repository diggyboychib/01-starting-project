<app-header />
<main>
  <ul id="users">
    @for (user of selectedUser; track user.id) {
      <li>
        <app-user [user]="user" [selected]="user.id===selectedUserId" (selectedUser)="getUserId($event)" />
      </li>
    }
  </ul>
  @if (selectedUserId) {
    <app-tasks [id]="selectedUserId" ></app-tasks>
  } @else {
    <p>No User Selected!</p>
  }
</main>
