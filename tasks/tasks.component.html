<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button>Add Tasks</button>
    </menu>
  </header>
  <ul>
    @for (task of selectedUser; track $index) {
      <li>
        <app-task [task]="task" (completedTaskId)="getCompletedId($event)"></app-task>
      </li>
    }
  </ul>
</section>
